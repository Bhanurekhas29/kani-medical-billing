{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Medical Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* body.login-page {
      font-family: 'Segoe UI', sans-serif;
      background: url("{% static 'login.png' %}") no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: black;
    } */
    body.login-page {
  font-family: 'Segoe UI', sans-serif;
  background: url("{% static 'login.png' %}") no-repeat center center fixed;
  background-size: 100% 100%; /* force-stretch */
  background-repeat: no-repeat;
  background-color: black;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

    .login-box {
      padding: 50px 40px;
      width: 360px;
      border-radius: 15px;
      text-align: center;
      color: white;
    }

    .login-box h2 {
      margin-bottom: 30px;
      font-size: 30px;
      color: #ffffff;
      margin-top: -30px;
      font-weight: bold;
    }

    .input-group {
      position: relative;
      margin: 30px 0;
    }

    .input-group i.fa-envelope,
    .input-group i.fa-lock {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: white;
    }

    .input-group input {
      width: 100%;
      padding: 12px 40px 12px 40px;
      border: 1px solid #007bff;
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.15);
      color: white;
      outline: none;
      font-size: 15px;
      font-weight: bold;
    }

    .input-group input::placeholder {
      color: #ddd;
      font-weight: bold;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      color: white;
      cursor: pointer;
    }

.forgot {
  margin-top: 15px;
  margin-bottom: 20px;
  text-align: right;
  padding-right: 10px; /* Increased from 10px to 30px */
}



    .forgot a {
      color: #ffffff;
      font-size: 14px;
      text-decoration: none;
      font-weight: bold;
    }

    .login-box button {
      width: 100%;
      padding: 12px 15px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 10px;
      font-weight: bold;
    }

    .login-box button:hover {
      background-color: #0056b3;
    }

    .error {
      color: #ff4c4c;
      margin-top: 15px;
      font-weight: bold;
    }

    @media screen and (max-width: 400px) {
      .login-box {
        width: 90%;
        padding: 30px 20px;
      }

      .login-box h2 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body class="login-page">
  <div class="login-box">
    <h2>Login</h2>
    <form method="POST">
      {% csrf_token %}

      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="text" name="username" placeholder="Enter Your User Name" required />
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" name="password" placeholder="Enter Your Password" required />
        <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
      </div>

      <div class="forgot">
        <a href="{% url 'reset_password' %}">Forgot Password?</a>
      </div>

      <button type="submit">Login</button>

      {% if msg %}
        <div class="error">{{ msg }}</div>
      {% endif %}
    </form>
  </div>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const toggleIcon = document.querySelector(".toggle-password");
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        toggleIcon.classList.remove("fa-eye");
        toggleIcon.classList.add("fa-eye-slash");
      } else {
        passwordInput.type = "password";
        toggleIcon.classList.remove("fa-eye-slash");
        toggleIcon.classList.add("fa-eye");
      }
    }
  </script>
</body>
</html>
