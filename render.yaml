services:
  - type: web
    name: kani-medical-billing
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn medical_booking.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kani-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
databases:
  - name: kani-db
    plan: free
